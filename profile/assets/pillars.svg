<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Five properties: architecture, security posture, resiliency, observability, supply chain"><title>Five properties: architecture, security posture, resiliency, observability, supply chain</title><defs><style>
    text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', system-ui, -apple-system, sans-serif; fill: #e6e8eb; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, ui-monospace, monospace; }
    .label { font-family: 'JetBrains Mono', 'SFMono-Regular', 'Cascadia Code', Menlo, Consolas, ui-monospace, monospace; font-size: 12px; letter-spacing: .2em; fill: #7c8794; }
    .flow { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-dasharray: 14 1400; stroke-dashoffset: 14;
            animation: flow 2.6s cubic-bezier(.5, 0, .5, 1) infinite; }
    @keyframes flow { 0% { stroke-dashoffset: 14; stroke-opacity: 0; } 12% { stroke-opacity: 1; }
            88% { stroke-opacity: 1; } 100% { stroke-dashoffset: -420; stroke-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style><radialGradient id="bg" cx="12%" cy="0%" r="95%"><stop offset="0" stop-color="#f59e0b" stop-opacity=".16"/><stop offset=".45" stop-color="#22d3ee" stop-opacity=".05"/><stop offset="1" stop-color="#0b0d10" stop-opacity="0"/></radialGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".6"/></filter><filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="1320" height="370"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".11"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0 L0 0 0 24" fill="none" stroke="#8b939e" stroke-opacity=".07"/></pattern><linearGradient id="face0" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b" stop-opacity=".12"/><stop offset=".6" stop-color="#f59e0b" stop-opacity=".02"/></linearGradient><linearGradient id="cell0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#f59e0b" stop-opacity=".62"/></linearGradient><marker id="head0" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker><linearGradient id="face1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset=".6" stop-color="#22d3ee" stop-opacity=".02"/></linearGradient><linearGradient id="cell1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".62"/></linearGradient><marker id="head1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/></marker><linearGradient id="face2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity=".12"/><stop offset=".6" stop-color="#a78bfa" stop-opacity=".02"/></linearGradient><linearGradient id="cell2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".62"/></linearGradient><marker id="head2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/></marker><linearGradient id="face3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185" stop-opacity=".12"/><stop offset=".6" stop-color="#fb7185" stop-opacity=".02"/></linearGradient><linearGradient id="cell3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fb7185" stop-opacity=".62"/></linearGradient><marker id="head3" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fb7185"/></marker><linearGradient id="face4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34d399" stop-opacity=".12"/><stop offset=".6" stop-color="#34d399" stop-opacity=".02"/></linearGradient><linearGradient id="cell4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity=".62"/></linearGradient><marker id="head4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker><linearGradient id="face5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa" stop-opacity=".12"/><stop offset=".6" stop-color="#60a5fa" stop-opacity=".02"/></linearGradient><linearGradient id="cell5" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#60a5fa" stop-opacity=".62"/></linearGradient><marker id="head5" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/></marker><linearGradient id="face6" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6" stop-opacity=".12"/><stop offset=".6" stop-color="#f472b6" stop-opacity=".02"/></linearGradient><linearGradient id="cell6" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity=".62"/></linearGradient><marker id="head6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f472b6"/></marker><linearGradient id="face7" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#facc15" stop-opacity=".12"/><stop offset=".6" stop-color="#facc15" stop-opacity=".02"/></linearGradient><linearGradient id="cell7" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#facc15"/><stop offset="1" stop-color="#facc15" stop-opacity=".62"/></linearGradient><marker id="head7" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#facc15"/></marker><linearGradient id="face8" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".12"/><stop offset=".6" stop-color="#2dd4bf" stop-opacity=".02"/></linearGradient><linearGradient id="cell8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".62"/></linearGradient><marker id="head8" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/></marker><linearGradient id="face9" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc" stop-opacity=".12"/><stop offset=".6" stop-color="#c084fc" stop-opacity=".02"/></linearGradient><linearGradient id="cell9" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#c084fc" stop-opacity=".62"/></linearGradient><marker id="head9" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c084fc"/></marker><linearGradient id="face10" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb923c" stop-opacity=".12"/><stop offset=".6" stop-color="#fb923c" stop-opacity=".02"/></linearGradient><linearGradient id="cell10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#fb923c" stop-opacity=".62"/></linearGradient><marker id="head10" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fb923c"/></marker><linearGradient id="face11" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade80" stop-opacity=".12"/><stop offset=".6" stop-color="#4ade80" stop-opacity=".02"/></linearGradient><linearGradient id="cell11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#4ade80" stop-opacity=".62"/></linearGradient><marker id="head11" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4ade80"/></marker></defs><rect width="1280" height="330" rx="4" fill="#0b0d10"/><rect width="1280" height="330" rx="4" fill="url(#bg)"/><rect width="1280" height="330" rx="4" fill="url(#grid)"/><rect x=".5" y=".5" width="1279" height="329" rx="4" fill="none" stroke="#2a3138"/><path d="M 8 22 L 8 8 L 22 8" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5"/><path d="M 1272 22 L 1272 8 L 1258 8" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5"/><path d="M 8 308 L 8 322 L 22 322" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5"/><path d="M 1272 308 L 1272 322 L 1258 322" fill="none" stroke="#f59e0b" stroke-opacity=".7" stroke-width="1.5"/><text x="32" y="44" class="label">FIVE PROPERTIES · EACH ONE CHECKED, NOT CLAIMED</text><rect x="32" y="70" width="226" height="222" rx="2" fill="#0c1015"/><rect x="32" y="70" width="226" height="222" rx="2" fill="url(#face1)" stroke="#22d3ee" stroke-opacity=".3"/><rect x="32" y="80" width="3" height="202" fill="#22d3ee" filter="url(#glow)"/><path d="M 43 70 L 32 70 L 32 81" fill="none" stroke="#22d3ee" stroke-width="1.8"/><path d="M 247 70 L 258 70 L 258 81" fill="none" stroke="#22d3ee" stroke-width="1.8"/><path d="M 43 292 L 32 292 L 32 281" fill="none" stroke="#22d3ee" stroke-width="1.8"/><path d="M 247 292 L 258 292 L 258 281" fill="none" stroke="#22d3ee" stroke-width="1.8"/><text x="46" y="62" class="mono" font-size="11" letter-spacing=".18em" fill="#22d3ee">P-01</text><rect x="50" y="92" width="48" height="48" rx="2" fill="#22d3ee" fill-opacity=".08" stroke="#22d3ee" stroke-opacity=".5"/><g transform="translate(60 102)" fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="2" y="2" width="10" height="10" rx="2"/><rect x="16" y="2" width="10" height="10" rx="2"/><rect x="9" y="16" width="10" height="10" rx="2"/><path d="M7 12 L14 16 M21 12 L14 16"/></g><text x="54" y="172" class="mono" font-size="16.5" font-weight="700">Architecture</text><text x="54" y="200" font-size="13.5" fill="#a3acb8">Every component is modelled</text><text x="54" y="220" font-size="13.5" fill="#a3acb8">before it exists. A</text><text x="54" y="240" font-size="13.5" fill="#a3acb8">component the model does</text><text x="54" y="260" font-size="13.5" fill="#a3acb8">not describe fails the</text><text x="54" y="280" font-size="13.5" fill="#a3acb8">build.</text><rect x="280" y="70" width="226" height="222" rx="2" fill="#0c1015"/><rect x="280" y="70" width="226" height="222" rx="2" fill="url(#face3)" stroke="#fb7185" stroke-opacity=".3"/><rect x="280" y="80" width="3" height="202" fill="#fb7185" filter="url(#glow)"/><path d="M 291 70 L 280 70 L 280 81" fill="none" stroke="#fb7185" stroke-width="1.8"/><path d="M 495 70 L 506 70 L 506 81" fill="none" stroke="#fb7185" stroke-width="1.8"/><path d="M 291 292 L 280 292 L 280 281" fill="none" stroke="#fb7185" stroke-width="1.8"/><path d="M 495 292 L 506 292 L 506 281" fill="none" stroke="#fb7185" stroke-width="1.8"/><text x="294" y="62" class="mono" font-size="11" letter-spacing=".18em" fill="#fb7185">P-02</text><rect x="298" y="92" width="48" height="48" rx="2" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" stroke-opacity=".5"/><g transform="translate(308 102)" fill="none" stroke="#fb7185" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M14 2 L25 6 V14 C25 20 20 25 14 27 C8 25 3 20 3 14 V6 Z"/><path d="M9 14 L13 18 L20 10"/></g><text x="302" y="172" class="mono" font-size="16.5" font-weight="700">Security posture</text><text x="302" y="200" font-size="13.5" fill="#a3acb8">Eighteen invariants,</text><text x="302" y="220" font-size="13.5" fill="#a3acb8">re-asserted nightly from</text><text x="302" y="240" font-size="13.5" fill="#a3acb8">outside the cluster. A</text><text x="302" y="260" font-size="13.5" fill="#a3acb8">failure pages; silence is a</text><text x="302" y="280" font-size="13.5" fill="#a3acb8">written-down gap.</text><rect x="528" y="70" width="226" height="222" rx="2" fill="#0c1015"/><rect x="528" y="70" width="226" height="222" rx="2" fill="url(#face4)" stroke="#34d399" stroke-opacity=".3"/><rect x="528" y="80" width="3" height="202" fill="#34d399" filter="url(#glow)"/><path d="M 539 70 L 528 70 L 528 81" fill="none" stroke="#34d399" stroke-width="1.8"/><path d="M 743 70 L 754 70 L 754 81" fill="none" stroke="#34d399" stroke-width="1.8"/><path d="M 539 292 L 528 292 L 528 281" fill="none" stroke="#34d399" stroke-width="1.8"/><path d="M 743 292 L 754 292 L 754 281" fill="none" stroke="#34d399" stroke-width="1.8"/><text x="542" y="62" class="mono" font-size="11" letter-spacing=".18em" fill="#34d399">P-03</text><rect x="546" y="92" width="48" height="48" rx="2" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".5"/><g transform="translate(556 102)" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M24 14 A10 10 0 1 1 20 6"/><path d="M20 1 V7 H26"/></g><text x="550" y="172" class="mono" font-size="16.5" font-weight="700">Resiliency</text><text x="550" y="200" font-size="13.5" fill="#a3acb8">No repair path. Anything</text><text x="550" y="220" font-size="13.5" fill="#a3acb8">broken is destroyed and</text><text x="550" y="240" font-size="13.5" fill="#a3acb8">rebuilt from a declaration,</text><text x="550" y="260" font-size="13.5" fill="#a3acb8">and every rebuild is</text><text x="550" y="280" font-size="13.5" fill="#a3acb8">measured.</text><rect x="776" y="70" width="226" height="222" rx="2" fill="#0c1015"/><rect x="776" y="70" width="226" height="222" rx="2" fill="url(#face2)" stroke="#a78bfa" stroke-opacity=".3"/><rect x="776" y="80" width="3" height="202" fill="#a78bfa" filter="url(#glow)"/><path d="M 787 70 L 776 70 L 776 81" fill="none" stroke="#a78bfa" stroke-width="1.8"/><path d="M 991 70 L 1002 70 L 1002 81" fill="none" stroke="#a78bfa" stroke-width="1.8"/><path d="M 787 292 L 776 292 L 776 281" fill="none" stroke="#a78bfa" stroke-width="1.8"/><path d="M 991 292 L 1002 292 L 1002 281" fill="none" stroke="#a78bfa" stroke-width="1.8"/><text x="790" y="62" class="mono" font-size="11" letter-spacing=".18em" fill="#a78bfa">P-04</text><rect x="794" y="92" width="48" height="48" rx="2" fill="#a78bfa" fill-opacity=".08" stroke="#a78bfa" stroke-opacity=".5"/><g transform="translate(804 102)" fill="none" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M2 15 H8 L11 7 L16 23 L19 15 H26"/></g><text x="798" y="172" class="mono" font-size="16.5" font-weight="700">Observability</text><text x="798" y="200" font-size="13.5" fill="#a3acb8">Metrics, logs and alert</text><text x="798" y="220" font-size="13.5" fill="#a3acb8">rules live beside the</text><text x="798" y="240" font-size="13.5" fill="#a3acb8">cluster. A monitor inside</text><text x="798" y="260" font-size="13.5" fill="#a3acb8">the thing cannot report it</text><text x="798" y="280" font-size="13.5" fill="#a3acb8">gone.</text><rect x="1024" y="70" width="226" height="222" rx="2" fill="#0c1015"/><rect x="1024" y="70" width="226" height="222" rx="2" fill="url(#face0)" stroke="#f59e0b" stroke-opacity=".3"/><rect x="1024" y="80" width="3" height="202" fill="#f59e0b" filter="url(#glow)"/><path d="M 1035 70 L 1024 70 L 1024 81" fill="none" stroke="#f59e0b" stroke-width="1.8"/><path d="M 1239 70 L 1250 70 L 1250 81" fill="none" stroke="#f59e0b" stroke-width="1.8"/><path d="M 1035 292 L 1024 292 L 1024 281" fill="none" stroke="#f59e0b" stroke-width="1.8"/><path d="M 1239 292 L 1250 292 L 1250 281" fill="none" stroke="#f59e0b" stroke-width="1.8"/><text x="1038" y="62" class="mono" font-size="11" letter-spacing=".18em" fill="#f59e0b">P-05</text><rect x="1042" y="92" width="48" height="48" rx="2" fill="#f59e0b" fill-opacity=".08" stroke="#f59e0b" stroke-opacity=".5"/><g transform="translate(1052 102)" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><rect x="2" y="9" width="12" height="10" rx="5"/><rect x="14" y="9" width="12" height="10" rx="5"/><path d="M10 14 H18"/></g><text x="1046" y="172" class="mono" font-size="16.5" font-weight="700">Supply chain</text><text x="1046" y="200" font-size="13.5" fill="#a3acb8">Nothing reaches the cluster</text><text x="1046" y="220" font-size="13.5" fill="#a3acb8">except a signed artifact</text><text x="1046" y="240" font-size="13.5" fill="#a3acb8">from one named workflow. A</text><text x="1046" y="260" font-size="13.5" fill="#a3acb8">push deploys nothing.</text></svg>